apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: https://github.com/charalamposlamprou/test-argocd.git
              revision: main
              directories:
                - path: apps/*/base
          - list:
              elements:
                - environment: dev
                  namespace: demo
                - environment: staging
                  namespace: demo-staging
                - environment: prod
                  namespace: demo-prod
  template:
    metadata:
      name: '{{.namespace}}-{{index .path.segments 1}}'
      labels:
        environment: '{{.environment}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/charalamposlamprou/test-argocd.git
        targetRevision: main
        path: 'apps/{{index .path.segments 1}}/overlays/{{.environment}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
