apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-services
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - service: payment
          - service: wallet
  template:
    metadata:
      name: 'demo-{{.service}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/charalamposlamprou/test-argocd.git
        targetRevision: main
        path: 'apps/{{.service}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: demo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
