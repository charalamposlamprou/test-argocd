apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  minReadySeconds: 5
  selector:
    matchLabels:
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: hashicorp/http-echo:1.0.0
          args: ["-listen=:8080", "-text=$(RESPONSE)"]
          envFrom:
            - configMapRef:
                name: response
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 2
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
