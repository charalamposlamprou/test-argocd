name: Kubernetes manifest review
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: charalamposlamprou/kubernetes-manifest-semantic-diff/.github/workflows/manifest-diff.yaml@89c108ed15a80554c2922a2c186302ba9132b5f9
