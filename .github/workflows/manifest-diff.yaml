name: Kubernetes manifest review
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  review:
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: charalamposlamprou/kubernetes-manifest-semantic-diff/.github/workflows/manifest-diff.yaml@4af7e863d36f0c58ef096cb1c568ee2049c92526
