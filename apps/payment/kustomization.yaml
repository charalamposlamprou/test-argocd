apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo
namePrefix: payment-
resources:
  - ../base
labels:
  - pairs:
      app.kubernetes.io/name: payment
    includeSelectors: true
configMapGenerator:
  - name: response
    literals:
      - RESPONSE=payment demo online
replicas:
  - name: api
    count: 2
